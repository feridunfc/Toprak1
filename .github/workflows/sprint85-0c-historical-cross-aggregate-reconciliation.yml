        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local_out
          python scripts/authority_audit.py --repo-root . --format dashboard --output local_out/sprint85_0c_authority.json --fail-on banned
          python - <<'PY'
          import json
          d=json.load(open('local_out/sprint85_0c_authority.json',encoding='utf-8'))
          c=d.get('counts') or d.get('summary') or {}
          banned=int(c.get('banned',d.get('banned',0)) or 0)
          assert banned == 0,d
          print('AUTHORITY_BANNED_ZERO_PASS',banned)
          PY

      - name: Zero mutation source guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('hfa-core/src/hfa/authority/redis_persistence.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          store = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'RedisCanonicalAuthorityStore')
          method = next(n for n in store.body if isinstance(n, ast.AsyncFunctionDef) and n.name == 'load_aggregate_history')
          forbidden = {'set','hset','hdel','delete','expire','xadd','eval','evalsha','commit','record_authority_conflict'}
