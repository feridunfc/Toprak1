name: Authority Gate

on:
  pull_request:
    branches:
      - baseline/local-import
      - main
  push:
    branches:
      - baseline/local-import
      - sprint/11-authority-evidence-hardening
      - sprint/37-e2e-task-execution-product-path

jobs:
  authority-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fakeredis pyyaml

      - name: Run authority tool tests
        run: |
          python -m pytest tests/core/test_authority_audit_tool.py tests/core/test_full_auto_smoke_script.py -q --tb=short

      - name: Run staging RC readiness boundary tests
        run: |
          python -m pytest tests/core/test_staging_rc_readiness_boundary.py -q --tb=short

      - name: Run staging RC evidence index tests
        run: |
          python -m pytest tests/core/test_staging_rc_evidence_index.py -q --tb=short

      - name: Run operator RC evidence panel tests
        run: |
          python -m pytest tests/core/test_operator_rc_evidence_panel.py -q --tb=short

      - name: Run operator RC dashboard panel tests
        run: |
          python -m pytest tests/core/test_operator_rc_dashboard_panel.py -q --tb=short

      - name: Run runtime health panel tests
        run: |
          python -m pytest tests/core/test_runtime_health_panel.py -q --tb=short

      - name: Run worker scheduler health signal tests
        run: |
          python -m pytest tests/core/test_worker_scheduler_health_signals.py -q --tb=short

      - name: Run e2e task execution product path tests
        run: |
          python -m pytest tests/integration/test_task_execution_product_path.py -q --tb=short

      - name: Generate authority dashboard artifact
        run: |
          mkdir -p docs/dashboard/artifacts
          python scripts/authority_audit.py --repo-root . --format dashboard --output docs/dashboard/artifacts/latest_authority.json --fail-on banned

      - name: Generate authority heatmap
        run: |
          python scripts/authority_audit.py --repo-root . --heatmap --fail-on none > docs/dashboard/artifacts/latest_authority_heatmap.json

      - name: Generate replay evidence artifact
        run: |
          python scripts/replay_compare.py --json --output docs/dashboard/artifacts/latest_replay.json

      - name: Generate deployment smoke artifacts
        run: |
          python scripts/deployment_smoke.py --json
          python scripts/redis_failover_smoke.py --json

      - name: Generate recovery audit artifact
        run: |
          USE_FAKE_REDIS=1 python scripts/recovery_audit.py --json

      - name: Generate artifact-backed recovery requeue dry-run artifact
        run: |
          USE_FAKE_REDIS=1 python scripts/recovery_requeue.py --run-id ci-missing-run --tenant-id ci --proof-mode artifacts --dry-run --json

      - name: Generate recovery requeue drill artifact
        run: |
          USE_FAKE_REDIS=1 python scripts/recovery_requeue_drill.py --json

      - name: Generate cold restart drill artifact
        run: |
          USE_FAKE_REDIS=1 python scripts/cold_restart_drill.py --json

      - name: Generate zombie completion drill artifact
        run: |
          USE_FAKE_REDIS=1 python scripts/zombie_completion_drill.py --json

      - name: Generate recovery auto-resume guardrail artifact
        run: |
          python scripts/recovery_auto_resume_guardrail.py --json

      - name: Generate worker scheduler health signal artifacts
        run: |
          python scripts/worker_scheduler_health_signals.py --json

      - name: Generate task execution demo artifact
        run: |
          python scripts/task_execution_product_path.py demo --tenant demo --message hello

      - name: Generate cognitive governance audit artifact
        run: |
          python scripts/cognitive_governance_audit.py --json

      - name: Generate semantic advisory contract artifact
        run: |
          python scripts/semantic_advisory_contract.py --json

      - name: Generate FeedbackWriter governance artifact
        run: |
          python scripts/feedbackwriter_governance.py --json

      - name: Generate SemanticBridge gate artifact
        run: |
          python scripts/semanticbridge_gate.py --json

      - name: Generate advisory governance rollup artifact
        run: |
          python scripts/advisory_governance_rollup.py --json

      - name: Generate production readiness rollup artifact
        run: |
          python scripts/production_readiness_rollup.py --json

      - name: Generate production readiness decision artifact
        run: |
          python scripts/production_readiness_decision.py --json

      - name: Generate production readiness evidence freeze artifact
        run: |
          python scripts/production_readiness_evidence_freeze.py --json

      - name: Generate staging RC gate artifact
        run: |
          python scripts/staging_release_candidate_gate.py --json

      - name: Generate staging RC readiness boundary artifact
        run: |
          python scripts/staging_rc_readiness_boundary.py --json

      - name: Generate staging RC evidence index artifact
        run: |
          python scripts/staging_rc_evidence_index.py --json

      - name: Generate operator RC evidence panel artifact
        run: |
          python scripts/operator_rc_evidence_panel.py --json

      - name: Generate operator RC dashboard panel artifact
        run: |
          python scripts/operator_rc_dashboard_panel.py --json

      - name: Generate runtime health panel artifact
        run: |
          python scripts/runtime_health_panel.py --json

      - name: Upload Authority Gate evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: authority-gate-evidence-${{ github.run_id }}
          path: |
            docs/dashboard/artifacts/latest_authority.json
            docs/dashboard/artifacts/latest_authority_heatmap.json
            docs/dashboard/artifacts/latest_replay.json
            docs/dashboard/artifacts/latest_deployment_smoke.json
            docs/dashboard/artifacts/latest_redis_failover_smoke.json
            docs/dashboard/artifacts/latest_recovery_audit.json
            docs/dashboard/artifacts/latest_recovery_requeue.json
            docs/dashboard/artifacts/latest_recovery_requeue_drill.json
            docs/dashboard/artifacts/latest_cold_restart_drill.json
            docs/dashboard/artifacts/latest_zombie_completion_drill.json
            docs/dashboard/artifacts/latest_recovery_auto_resume_guardrail.json
            docs/dashboard/artifacts/latest_worker_health_signal.json
            docs/dashboard/artifacts/latest_scheduler_control_signal.json
            docs/dashboard/artifacts/latest_task_execution_demo.json
            docs/dashboard/artifacts/latest_cognitive_governance_audit.json
            docs/dashboard/artifacts/latest_semantic_advisory_contract.json
            docs/dashboard/artifacts/latest_feedbackwriter_governance.json
            docs/dashboard/artifacts/latest_semanticbridge_gate.json
            docs/dashboard/artifacts/latest_advisory_governance_rollup.json
            docs/dashboard/artifacts/latest_production_readiness_rollup.json
            docs/dashboard/artifacts/latest_production_readiness_decision.json
            docs/dashboard/artifacts/latest_production_readiness_evidence_freeze.json
            docs/dashboard/artifacts/latest_staging_release_candidate_gate.json
            docs/dashboard/artifacts/latest_staging_rc_readiness_boundary.json
            docs/dashboard/artifacts/latest_staging_rc_evidence_index.json
            docs/dashboard/artifacts/latest_operator_rc_evidence_panel.json
            docs/dashboard/artifacts/latest_operator_rc_dashboard_panel.json
            docs/dashboard/artifacts/latest_runtime_health_panel.json
          if-no-files-found: error

      - name: Smoke command dry run
        run: |
          python scripts/full_auto_v3_2_smoke.py --dry-run --redis-mode auto