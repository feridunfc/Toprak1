name: Authority Gate

on:
  pull_request:
    branches:
      - baseline/local-import
      - main
  push:
    branches:
      - baseline/local-import

jobs:
  authority-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      # Sprint 8 hard requirement:
      # The new audit/smoke tooling itself must pass.
      - name: Run Sprint 8 tool tests
        run: |
          python -m pytest tests/core/test_authority_audit_tool.py tests/core/test_full_auto_smoke_script.py -q --tb=short

      # Sprint 8 is a baseline/reporting sprint.
      # Known repo risks must be reported, not block this PR.
      - name: Generate authority audit baseline report
        run: |
          python scripts/authority_audit.py --repo-root . --format text --fail-on none
          python scripts/authority_audit.py --repo-root . --heatmap --fail-on none
          python scripts/authority_audit.py --repo-root . --format dashboard --fail-on none

      - name: Smoke command dry run
        run: |
          python scripts/full_auto_v3_2_smoke.py --dry-run --redis-mode auto