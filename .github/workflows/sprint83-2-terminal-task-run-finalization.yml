name: Sprint 83.2 Terminal TASK to RUN Finalization

on:
  pull_request:
    branches:
      - baseline/local-import
    paths:
      - .github/workflows/sprint83-2-terminal-task-run-finalization.yml
      - docs/implementation/sprint83/SPRINT83.2-terminal-task-run-finalization.md
      - hfa-core/src/hfa/lua/run_terminate_from_tasks.lua
      - hfa-control/src/hfa_control/run_termination.py
      - hfa-worker/src/hfa_worker/run_finalizing_runtime.py
      - scripts/runtime_alpha_acceptance_83_2.py
      - tests/integration/test_terminal_task_run_finalization.py
      - tests/integration/test_runtime_alpha_product_acceptance_83_2.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  REDIS_URL: redis://127.0.0.1:6389/15
  SPRINT81_2_REDIS_URL: redis://127.0.0.1:6379/0
  USE_EXISTING_REDIS: "1"
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  terminal-task-run-finalization:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
          - 6389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out HEAD
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Verify Sprint 83.2 scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              print("SPRINT83_2_MANUAL_DISPATCH_SCOPE_CHECK_NOT_APPLICABLE")
              raise SystemExit(0)

          workflow = ".github/workflows/sprint83-2-terminal-task-run-finalization.yml"
          protected = {
              workflow,
              "docs/implementation/sprint83/SPRINT83.2-terminal-task-run-finalization.md",
              "hfa-core/src/hfa/lua/run_terminate_from_tasks.lua",
              "hfa-control/src/hfa_control/run_termination.py",
              "hfa-worker/src/hfa_worker/run_finalizing_runtime.py",
              "scripts/runtime_alpha_acceptance_83_2.py",
              "tests/integration/test_terminal_task_run_finalization.py",
              "tests/integration/test_runtime_alpha_product_acceptance_83_2.py",
          }
          base = os.environ["PR_BASE_SHA"]
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}...HEAD"],
                  text=True,
              ).splitlines()
          )
          workflow_existed = subprocess.run(
              ["git", "cat-file", "-e", f"{base}:{workflow}"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0

          if workflow_existed:
              touched = changed & protected
              assert touched, {
                  "reason": "workflow ran without a protected Sprint 83.2 path change",
                  "changed": sorted(changed),
              }
              unexpected = changed - protected
              assert not unexpected, {
                  "reason": "Sprint 83.2 regression scope escaped protected paths",
                  "unexpected": sorted(unexpected),
              }
              print("SPRINT83_2_REGRESSION_TRIGGER_OK", sorted(touched))
          else:
              assert changed == protected, {
                  "reason": "Sprint 83.2 bootstrap scope mismatch",
                  "missing": sorted(protected - changed),
                  "unexpected": sorted(changed - protected),
              }
              print("SPRINT83_2_BOOTSTRAP_EXACT_SCOPE_OK", sorted(changed))
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e hfa-core -e hfa-control -e hfa-worker
          python -m pip install pytest pytest-asyncio redis fakeredis rfc8785 fastapi httpx uvicorn

      - name: Sprint 81 authority regressions
        run: |
          set -o pipefail
          python -m pytest hfa-core/tests/authority/test_canonical_transition.py -q --tb=short | tee sprint81_1.txt
          python -m pytest hfa-core/tests/authority/test_redis_canonical_authority.py -q --tb=short | tee sprint81_2.txt
          ! grep -Eqi 'skipped|deselected' sprint81_2.txt

      - name: Sprint 82 runtime truth regressions
        run: |
          set -o pipefail
          python -m pytest tests/unit/test_scheduler_runtime_truth_guard.py -q --tb=short | tee sprint82_1_unit.txt
          python -m pytest tests/integration/test_scheduler_runtime_truth_guard_integration.py -q --tb=short | tee sprint82_1_integration.txt
          python -m pytest tests/unit/test_worker_runtime_truth_guards.py -q --tb=short | tee sprint82_2_unit.txt
          python -m pytest tests/integration/test_worker_runtime_truth_guards_integration.py -q --tb=short | tee sprint82_2_integration.txt
          python -m pytest tests/integration/test_worker_runtime_truth_guard_e2e.py -q --tb=short | tee sprint82_2_e2e.txt
          python -m pytest tests/unit/test_recovery_read_model_convergence.py -q --tb=short | tee sprint82_3_unit.txt
          python -m pytest tests/integration/test_recovery_read_model_convergence_integration.py -q --tb=short | tee sprint82_3_integration.txt
          python -m pytest tests/integration/test_recovery_read_model_convergence_e2e.py -q --tb=short | tee sprint82_3_e2e.txt
          python -m pytest tests/integration/test_nine_observation_truth_closure.py -q --tb=short | tee sprint82_4.txt
          ! grep -Eqi 'skipped|deselected|xfailed|xpassed' sprint82_1_integration.txt sprint82_2_integration.txt sprint82_2_e2e.txt sprint82_3_integration.txt sprint82_3_e2e.txt sprint82_4.txt
          grep -Eq '(^|[^0-9])9 passed' sprint82_4.txt

      - name: Terminal duplicate compatibility regression
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_worker_consumer_terminal_duplicate_delivery_integration.py -q --tb=short | tee terminal_duplicate_regression.txt
          ! grep -Eqi 'skipped|deselected|xfailed|xpassed' terminal_duplicate_regression.txt
          grep -Eq '(^|[^0-9])2 passed' terminal_duplicate_regression.txt

      - name: Sprint 83.1 historical acceptance regression
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_runtime_alpha_product_acceptance.py -q --tb=short | tee sprint83_1.txt
          ! grep -Eqi 'skipped|deselected|xfailed|xpassed' sprint83_1.txt
          grep -Eq '(^|[^0-9])3 passed' sprint83_1.txt

      - name: Sprint 83.2 RUN_TERMINATE real Redis tests
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_terminal_task_run_finalization.py -q --tb=short | tee sprint83_2_run_terminate.txt
          ! grep -Eqi 'skipped|deselected|xfailed|xpassed' sprint83_2_run_terminate.txt
          grep -Eq '(^|[^0-9])11 passed' sprint83_2_run_terminate.txt

      - name: Sprint 83.2 product acceptance tests
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_runtime_alpha_product_acceptance_83_2.py -q --tb=short | tee sprint83_2_acceptance.txt
          ! grep -Eqi 'skipped|deselected|xfailed|xpassed' sprint83_2_acceptance.txt
          grep -Eq '(^|[^0-9])3 passed' sprint83_2_acceptance.txt

      - name: Generate Sprint 83.2 acceptance artifact
        run: |
          python scripts/runtime_alpha_acceptance_83_2.py \
            --redis-url "$REDIS_URL" \
            --acceptance-id ci-s83-2 \
            --reset-test-db \
            --out local_out/sprint83/runtime_alpha_acceptance_83_2.json \
            --json | tee runtime_alpha_acceptance_83_2_stdout.json

      - name: Verify Sprint 83.2 acceptance artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("local_out/sprint83/runtime_alpha_acceptance_83_2.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["schema_version"] == 2
          assert data["sprint"] == "83.2"
          assert data["status"] == "PASS_WITH_LIMITATIONS"
          assert data["runtime_alpha_testable"] is True
          assert data["product_alpha_ready"] is False
          assert data["production_ready"] is False
          assert data["run_finalization_supported"] is True
          assert data["run_result_visible"] is True
          assert data["run_terminal_event_visible"] is True
          assert data["run_termination_binding_default_enabled"] is False
          assert data["run_termination_binding_test_enabled"] is True
          assert data["cancel_command_supported"] is False
          assert data["retry_command_supported"] is False
          assert data["automatic_repair_authorized"] is False
          assert data["production_cutover_authorized"] is False
          assert [row["name"] for row in data["scenarios"]] == [
              "canonical_task_success_finalizes_run",
              "terminal_run_blocks_dispatch",
          ]
          assert all(row["status"] == "PASS" for row in data["scenarios"])
          healthy = data["scenarios"][0]
          assert healthy["run_state"] == "done"
          assert healthy["run_truth_status"] == "consistent"
          assert healthy["run_result"]["finalization_operation"] == "RUN_TERMINATE"
          assert healthy["run_terminal_events"][0]["event_type"] == "RunCompleted"
          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      - name: Source boundary scan
        run: |
          python - <<'PY'
          from pathlib import Path

          lua = Path("hfa-core/src/hfa/lua/run_terminate_from_tasks.lua").read_text(encoding="utf-8")
          forbidden = [
              "task_complete.lua",
              "TASK_REQUEUE",
              "TASK_CANCEL",
              "task_remaining_deps",
              "tenant_ready_queue",
              "worker_reservation",
          ]
          for token in forbidden:
              assert token not in lua, token
          assert '"RUN_TERMINATE"' in lua
          coordinator = Path(
              "hfa-control/src/hfa_control/run_termination.py"
          ).read_text(encoding="utf-8")
          assert "enabled: bool = False" in coordinator
          assert "run_termination_binding_enabled" in coordinator
          print("SPRINT83_2_BOUNDARY_SCAN_OK")
          PY

      - name: Compile lifecycle and acceptance packages
        run: |
          python -m py_compile scripts/runtime_alpha_acceptance_83_2.py
          python -m compileall -q hfa-core/src/hfa hfa-control/src/hfa_control hfa-worker/src/hfa_worker
          python -m py_compile tests/integration/test_terminal_task_run_finalization.py tests/integration/test_runtime_alpha_product_acceptance_83_2.py

      - name: Patch whitespace check
        if: github.event_name == 'pull_request'
        run: |
          git diff --check "$PR_BASE_SHA...HEAD"

      - name: Upload Sprint 83.2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint83-2-run-finalization-${{ github.run_id }}
          path: |
            sprint81_1.txt
            sprint81_2.txt
            sprint82_1_unit.txt
            sprint82_1_integration.txt
            sprint82_2_unit.txt
            sprint82_2_integration.txt
            sprint82_2_e2e.txt
            sprint82_3_unit.txt
            sprint82_3_integration.txt
            sprint82_3_e2e.txt
            sprint82_4.txt
            terminal_duplicate_regression.txt
            sprint83_1.txt
            sprint83_2_run_terminate.txt
            sprint83_2_acceptance.txt
            runtime_alpha_acceptance_83_2_stdout.json
            local_out/sprint83/runtime_alpha_acceptance_83_2.json
          if-no-files-found: warn
