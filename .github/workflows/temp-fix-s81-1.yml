name: Temporary Sprint 81.1 Authority Fix

on:
  push:
    branches:
      - sprint/81-1-canonical-transition-core
    paths:
      - .github/workflows/temp-fix-s81-1.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: sprint/81-1-canonical-transition-core
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct exact correction
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/s81-1-fix/chunk_* | tr -d '\n' | base64 -d > /tmp/s81-fix.tar.gz
          echo '1461d5697458ede14ff233f95c0d824167c7d673fba7f943b1e7f34d5d41d4e2  /tmp/s81-fix.tar.gz' | sha256sum -c -
          tar -xzf /tmp/s81-fix.tar.gz -C .
          cat > /tmp/expected.sha256 <<'EOF'
          b82241a9e72077c4157f438f4bd7f2700eec1b44023d7ffe57d3cb06c53eeed9  hfa-core/src/hfa/authority/canonical_transition.py
          841d7e4e9eb440556a2d97914f21c524a69451fbe2ddd71729c57d3e1722fe36  hfa-core/tests/authority/test_canonical_transition.py
          EOF
          sed -i 's/^          //' /tmp/expected.sha256
          sha256sum -c /tmp/expected.sha256
      - name: Install implementation and test dependencies
        run: python -m pip install -e 'hfa-core[dev]'
      - name: Validate corrected authority core
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest hfa-core/tests/authority/test_canonical_transition.py -q
          python -m compileall -q hfa-core/src/hfa/authority
          git diff --check
      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/s81-1-fix
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hfa-core/src/hfa/authority/canonical_transition.py
          git add hfa-core/tests/authority/test_canonical_transition.py
          git add -A .tmp/s81-1-fix
          git diff --cached --check
          git commit -m 'fix(sprint81): bind authority decisions and receipts'
          git push origin HEAD:sprint/81-1-canonical-transition-core
