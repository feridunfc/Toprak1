name: Sprint 82.4 Nine-Observation Closure

on:
  pull_request:
    branches:
      - baseline/local-import
    paths:
      - .github/workflows/sprint82-4-nine-observation-closure.yml
      - docs/implementation/sprint82/SPRINT82.4-nine-observation-closure.md
      - tests/integration/test_nine_observation_truth_closure.py
      - hfa-control/src/hfa_control/service.py
      - hfa-worker/src/hfa_worker/runtime/terminal_duplicate_delivery.py
      - hfa-worker/src/hfa_worker/consumer.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  REDIS_URL: redis://127.0.0.1:6389/0
  SPRINT81_2_REDIS_URL: redis://127.0.0.1:6379/0
  USE_EXISTING_REDIS: "1"
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  nine-observation-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
          - 6389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out HEAD
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Verify bounded Sprint 82.4 scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          mandatory = {
              ".github/workflows/sprint82-4-nine-observation-closure.yml",
              "docs/implementation/sprint82/SPRINT82.4-nine-observation-closure.md",
              "tests/integration/test_nine_observation_truth_closure.py",
          }
          optional_runtime = {
              "hfa-control/src/hfa_control/service.py",
              "hfa-worker/src/hfa_worker/runtime/terminal_duplicate_delivery.py",
              "hfa-worker/src/hfa_worker/consumer.py",
          }
          allowed = mandatory | optional_runtime
          base = os.environ["PR_BASE_SHA"]
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}...HEAD"],
                  text=True,
              ).splitlines()
          )
          assert mandatory <= changed, {
              "reason": "mandatory Sprint 82.4 files missing",
              "missing": sorted(mandatory - changed),
          }
          assert changed <= allowed, {
              "reason": "unexpected Sprint 82.4 scope",
              "unexpected": sorted(changed - allowed),
          }
          print("SPRINT82_4_SCOPE_OK", sorted(changed))
          PY

      - name: Verify frozen Sprint 80 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tests/diagnostics/sprint80/test_80_06_truth_contradictions.py)" = \
            "ba3e1b8e89c64d3aa78de7aa5144a31e031850de"
          test -z "$(git diff --name-only "$PR_BASE_SHA...HEAD" -- tests/diagnostics/sprint80)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e hfa-core -e hfa-control -e hfa-worker
          python -m pip install pytest pytest-asyncio redis fakeredis rfc8785

      - name: Sprint 81.1 regression
        run: |
          set -o pipefail
          python -m pytest hfa-core/tests/authority/test_canonical_transition.py -q --tb=short | tee sprint81_1.txt
          grep -Eq '([7-9][7-9]|[89][0-9]|[1-9][0-9]{2,}) passed' sprint81_1.txt

      - name: Sprint 81.2 real Redis regression
        run: |
          set -o pipefail
          python -m pytest hfa-core/tests/authority/test_redis_canonical_authority.py -q --tb=short | tee sprint81_2.txt
          ! grep -Eqi 'skipped|deselected' sprint81_2.txt
          passed="$(grep -Eo '[0-9]+ passed' sprint81_2.txt | tail -1 | awk '{print $1}')"
          test "${passed:-0}" -ge 56

      - name: Sprint 81.3 regressions
        run: |
          set -o pipefail
          python -m pytest tests/unit/test_task_admit_authority_binding.py -q --tb=short | tee sprint81_3_unit.txt
          python -m pytest tests/integration/test_task_admit_authority_binding_integration.py -q --tb=short | tee sprint81_3_integration.txt
          ! grep -Eqi 'skipped|deselected' sprint81_3_integration.txt

      - name: Sprint 82.1 regressions
        run: |
          set -o pipefail
          python -m pytest tests/unit/test_scheduler_runtime_truth_guard.py -q --tb=short | tee sprint82_1_unit.txt
          python -m pytest tests/integration/test_scheduler_runtime_truth_guard_integration.py -q --tb=short | tee sprint82_1_integration.txt
          ! grep -Eqi 'skipped|deselected' sprint82_1_integration.txt

      - name: Sprint 82.2 regressions
        run: |
          set -o pipefail
          python -m pytest tests/unit/test_worker_runtime_truth_guards.py -q --tb=short | tee sprint82_2_unit.txt
          python -m pytest tests/integration/test_worker_runtime_truth_guards_integration.py -q --tb=short | tee sprint82_2_integration.txt
          python -m pytest tests/integration/test_worker_runtime_truth_guard_e2e.py -q --tb=short | tee sprint82_2_e2e.txt
          ! grep -Eqi 'skipped|deselected' sprint82_2_integration.txt sprint82_2_e2e.txt

      - name: Sprint 82.3 regressions
        run: |
          set -o pipefail
          python -m pytest tests/unit/test_recovery_read_model_convergence.py -q --tb=short | tee sprint82_3_unit.txt
          python -m pytest tests/integration/test_recovery_read_model_convergence_integration.py -q --tb=short | tee sprint82_3_integration.txt
          python -m pytest tests/integration/test_recovery_read_model_convergence_e2e.py -q --tb=short | tee sprint82_3_e2e.txt
          ! grep -Eqi 'skipped|deselected' sprint82_3_integration.txt sprint82_3_e2e.txt

      - name: Sprint 82.4 exact nine-observation closure
        run: |
          set -o pipefail
          python -m pytest tests/integration/test_nine_observation_truth_closure.py \
            -q --tb=short --junitxml=sprint82_4_closure.xml | tee sprint82_4_closure.txt
          ! grep -Eqi 'skipped|deselected|xfailed|xpassed' sprint82_4_closure.txt
          grep -Eq '(^|[^0-9])9 passed' sprint82_4_closure.txt

      - name: Generate deterministic closure evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected = {
              "test_observation_01_api_run_done_task_running": {
                  "observation": 1,
                  "caller": "control_api_run_state",
                  "scenario": "api_run_done_task_running",
              },
              "test_observation_02_api_run_running_task_done": {
                  "observation": 2,
                  "caller": "control_api_run_state",
                  "scenario": "api_run_running_task_done",
              },
              "test_observation_03_run_recovery_missing_run_task_terminal": {
                  "observation": 3,
                  "caller": "run_recovery_missing_state",
                  "scenario": "run_missing_task_terminal",
              },
              "test_observation_04_run_recovery_terminal_run_task_running": {
                  "observation": 4,
                  "caller": "run_recovery_terminal_guard",
                  "scenario": "run_terminal_task_running_recovery",
              },
              "test_observation_05_task_recovery_missing_task_run_terminal": {
                  "observation": 5,
                  "caller": "task_recovery_missing_state",
                  "scenario": "task_missing_run_terminal",
              },
              "test_observation_06_worker_nonterminal_task_terminal_run_blocks_claim": {
                  "observation": 6,
                  "caller": "worker_task_duplicate_guard_nonterminal",
                  "scenario": "run_done_task_running_duplicate_guard",
              },
              "test_observation_07_worker_terminal_task_nonterminal_run_transport_cleanup": {
                  "observation": 7,
                  "caller": "worker_task_duplicate_guard_terminal",
                  "scenario": "run_running_task_done_worker_guard",
              },
              "test_observation_08_legacy_worker_terminal_run_suppresses_execution": {
                  "observation": 8,
                  "caller": "legacy_worker_run_guard",
                  "scenario": "run_done_task_running_legacy_worker_guard",
              },
              "test_observation_09_scheduler_terminal_run_ready_task_blocks_dispatch": {
                  "observation": 9,
                  "caller": "scheduler_dag_dispatch",
                  "scenario": "run_terminal_task_ready_scheduler",
              },
          }

          root = ET.parse("sprint82_4_closure.xml").getroot()
          cases = list(root.iter("testcase"))
          names = [case.attrib["name"] for case in cases]
          assert len(cases) == 9, {"reason": "unexpected test count", "names": names}
          assert set(names) == set(expected), {
              "reason": "unexpected observation identities",
              "missing": sorted(set(expected) - set(names)),
              "unexpected": sorted(set(names) - set(expected)),
          }
          for case in cases:
              assert case.find("failure") is None
              assert case.find("error") is None
              assert case.find("skipped") is None

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          frozen_blob = subprocess.check_output(
              ["git", "hash-object", "tests/diagnostics/sprint80/test_80_06_truth_contradictions.py"],
              text=True,
          ).strip()
          observations = []
          for name, metadata in sorted(expected.items(), key=lambda item: item[1]["observation"]):
              observations.append({
                  **metadata,
                  "test_name": name,
                  "status": "PASS",
              })

          payload = {
              "schema_version": 1,
              "sprint": "82.4",
              "closure_status": "PASS",
              "global_truth_policy": "OPERATION_SCOPED_FAIL_CLOSED",
              "base_sha": os.environ["PR_BASE_SHA"],
              "head_sha": head,
              "frozen_sprint80_diagnostic_blob": frozen_blob,
              "observation_count": len(observations),
              "caller_count": len({row["caller"] for row in observations}),
              "observations": observations,
              "production_runtime_files_changed": [],
              "automatic_repair_authorized": False,
              "production_cutover_authorized": False,
              "production_ready_claim": False,
          }
          assert payload["observation_count"] == 9
          assert payload["caller_count"] == 8
          assert frozen_blob == "ba3e1b8e89c64d3aa78de7aa5144a31e031850de"
          Path("sprint82_4_nine_observation_closure.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Compile lifecycle packages
        run: |
          python -m compileall -q \
            hfa-core/src/hfa \
            hfa-control/src/hfa_control \
            hfa-worker/src/hfa_worker

      - name: Patch whitespace check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PR_BASE_SHA...HEAD"

      - name: Upload closure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint82-4-nine-observation-${{ github.run_id }}
          path: |
            sprint81_1.txt
            sprint81_2.txt
            sprint81_3_unit.txt
            sprint81_3_integration.txt
            sprint82_1_unit.txt
            sprint82_1_integration.txt
            sprint82_2_unit.txt
            sprint82_2_integration.txt
            sprint82_2_e2e.txt
            sprint82_3_unit.txt
            sprint82_3_integration.txt
            sprint82_3_e2e.txt
            sprint82_4_closure.txt
            sprint82_4_closure.xml
            sprint82_4_nine_observation_closure.json
          if-no-files-found: warn
