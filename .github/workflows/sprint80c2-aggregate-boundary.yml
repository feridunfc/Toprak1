name: Sprint 80C.2 Aggregate Boundary

on:
  pull_request:
    branches:
      - baseline/local-import
    paths:
      - .github/workflows/sprint80c2-aggregate-boundary.yml
      - docs/adr/sprint80/ADR-080C2-aggregate-boundary.md
      - docs/adr/sprint80/evidence/aggregate_boundary.run93.json
      - docs/adr/sprint80/aggregate_boundary_manifest.json
      - docs/adr/sprint80/aggregate_boundary_matrix.json
      - scripts/sprint80c/validate_aggregate_boundary.py
      - tests/diagnostics/sprint80c/test_80c2_aggregate_boundary.py

permissions:
  contents: write

jobs:
  aggregate-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: sprint/80c2-aggregate-boundary
          fetch-depth: 1
          show-progress: false
      - name: Execute staged exact patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temp-harden-80c2.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/harden80c2.py').write_text(script, encoding='utf-8')
          PY
          sed -i 's/if count != 1:/if count < 1:/' /tmp/harden80c2.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/harden80c2.py')
          source = path.read_text(encoding='utf-8')
          label_position = source.index('"validator terminal missing authority"')
          block_start = source.rfind('validator = replace_once(', 0, label_position)
          block_end = source.index('\nvalidator = replace_once(', label_position)
          replacement = """terminal_loop = validator.index('    for state in ("dead_lettered", "skipped"):')
          retry_marker = '            and disposition.get("retry") == "STOP",'
          retry_position = validator.index(retry_marker, terminal_loop)
          missing_guard = (
              '            and disposition.get("missing_authority_evidence")' + chr(10)
              + '            == "MISSING_AUTHORITY_DURABLE_CONFLICT_AND_RECONCILIATION"' + chr(10)
          )
          validator = validator[:retry_position] + missing_guard + validator[retry_position:]
          """
          source = source[:block_start] + replacement + source[block_end + 1:]
          path.write_text(source, encoding='utf-8')
          PY
          set +e
          python /tmp/harden80c2.py > /tmp/harden80c2.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 60 /tmp/harden80c2.log > .harden80c2-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .harden80c2-error.txt
            git commit -m 'chore(sprint80c): capture hardener failure'
            git push origin HEAD:sprint/80c2-aggregate-boundary
            exit "$status"
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/sprint80c/validate_aggregate_boundary.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('def validate_manifest(')
          end = source.index('def validate_scope(', start)
          lines = [
              'def validate_manifest(root: Path, manifest: dict[str, Any]) -> list[str]:',
              '    errors: list[str] = []',
              '    expected_bundle_index_algorithm = (',
              '        "sorted_utf8_lines:path" + chr(92) + "0size_bytes" + chr(92) + "0sha256" + chr(92) + "n"',
              '    )',
              '    add_error(manifest.get("schema_version") == 3 and manifest.get("decision_id") == "ADR-080C2", "manifest identity", errors)',
              '    add_error(',
              '        manifest.get("base_head") == BASE',
              '        and manifest.get("frozen_source_head") == SOURCE',
              '        and manifest.get("frozen_artifact_sha256") == ZIP_SHA',
              '        and manifest.get("aggregate_evidence_sha256") == EVIDENCE_SHA',
              '        and manifest.get("bundle_index_algorithm") == expected_bundle_index_algorithm',
              '        and manifest.get("product_source_mutation") == 0',
              '        and manifest.get("implementation_authorized") is False,',
              '        "manifest immutable register",',
              '        errors,',
              '    )',
              '    add_error(',
              '        manifest.get("predecessor_acceptance_record_present") is True',
              '        and manifest.get("predecessor_acceptance_verified") is True',
              '        and manifest.get("predecessor_human_acceptance") == "ACCEPT"',
              '        and manifest.get("predecessor_acceptance_comment_id") == 5083135387',
              '        and manifest.get("predecessor_accepted_head") == "9ad9503badd72afb0a935dbb8c02e828ea02d3e2"',
              '        and manifest.get("predecessor_merge_commit") == BASE,',
              '        "manifest predecessor acceptance",',
              '        errors,',
              '    )',
              '    entries = manifest.get("artifacts", [])',
              '    expected = PATHS - {"docs/adr/sprint80/aggregate_boundary_manifest.json"}',
              '    add_error({row.get("path") for row in entries} == expected and len(entries) == 6, "manifest paths", errors)',
              '    for row in entries:',
              '        artifact_path = root / row["path"]',
              '        add_error(artifact_path.exists(), f\'missing {row["path"]}\', errors)',
              '        if artifact_path.exists():',
              '            add_error(artifact_path.stat().st_size == row["size_bytes"], f\'size {row["path"]}\', errors)',
              '            add_error(sha(artifact_path.read_bytes()) == row["sha256"], f\'hash {row["path"]}\', errors)',
              '    add_error(manifest.get("bundle_index_sha256") == sha(bundle_index(entries)), "bundle index", errors)',
              '    return errors',
              '',
              '',
          ]
          path.write_text(source[:start] + '\n'.join(lines) + source[end:], encoding='utf-8')
          PY
      - name: Restore final seven-file package
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/sprint80c2-aggregate-boundary.yml <<'EOF'
          name: Sprint 80C.2 Aggregate Boundary

          on:
            pull_request:
              branches:
                - baseline/local-import
              paths:
                - .github/workflows/sprint80c2-aggregate-boundary.yml
                - docs/adr/sprint80/ADR-080C2-aggregate-boundary.md
                - docs/adr/sprint80/evidence/aggregate_boundary.run93.json
                - docs/adr/sprint80/aggregate_boundary_manifest.json
                - docs/adr/sprint80/aggregate_boundary_matrix.json
                - scripts/sprint80c/validate_aggregate_boundary.py
                - tests/diagnostics/sprint80c/test_80c2_aggregate_boundary.py

          permissions:
            contents: read

          jobs:
            aggregate-boundary:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout exact PR head
                  uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.pull_request.head.sha }}
                    fetch-depth: 0
                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Install test dependency
                  run: python -m pip install pytest
                - name: Run Sprint 80C.2 package tests
                  run: python -m pytest tests/diagnostics/sprint80c/test_80c2_aggregate_boundary.py -q
                - name: Validate Sprint 80C.2 package and source bindings
                  run: >-
                    python scripts/sprint80c/validate_aggregate_boundary.py
                    --repo-root .
                    --verify-source-bindings
                    --verify-git-scope
                - name: Check patch whitespace
                  run: git diff --check 9d7c7a6ad52a8a546a708dda048f28d4e23befc6...HEAD
          EOF
          sed -i 's/^          //' .github/workflows/sprint80c2-aggregate-boundary.yml
          rm .github/workflows/temp-harden-80c2.yml
          rm -f .harden80c2-error.txt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd()
          path = root / 'docs/adr/sprint80/aggregate_boundary_manifest.json'
          manifest = json.loads(path.read_text(encoding='utf-8'))
          for row in manifest['artifacts']:
              data = (root / row['path']).read_bytes()
              row['size_bytes'] = len(data)
              row['sha256'] = hashlib.sha256(data).hexdigest()
          bundle = ''.join(
              f'{row["path"]}\0{row["size_bytes"]}\0{row["sha256"]}\n'
              for row in sorted(manifest['artifacts'], key=lambda item: item['path'])
          ).encode('utf-8')
          manifest['bundle_index_sha256'] = hashlib.sha256(bundle).hexdigest()
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate final correction
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest
          set +e
          python -m pytest tests/diagnostics/sprint80c/test_80c2_aggregate_boundary.py -q > /tmp/final-validation.log 2>&1
          pytest_status=$?
          python scripts/sprint80c/validate_aggregate_boundary.py --repo-root . >> /tmp/final-validation.log 2>&1
          validator_status=$?
          git diff --check >> /tmp/final-validation.log 2>&1
          diff_status=$?
          set -e
          if [ "$pytest_status" -ne 0 ] || [ "$validator_status" -ne 0 ] || [ "$diff_status" -ne 0 ]; then
            tail -n 100 /tmp/final-validation.log > .harden80c2-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .harden80c2-error.txt
            git commit -m 'chore(sprint80c): capture final validation failure'
            git push origin HEAD:sprint/80c2-aggregate-boundary
            exit 1
          fi
      - name: Commit exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/sprint80c2-aggregate-boundary.yml
          git add -A .github/workflows/temp-harden-80c2.yml
          git add -A .harden80c2-error.txt
          git add docs/adr/sprint80/ADR-080C2-aggregate-boundary.md
          git add docs/adr/sprint80/aggregate_boundary_matrix.json
          git add docs/adr/sprint80/aggregate_boundary_manifest.json
          git add scripts/sprint80c/validate_aggregate_boundary.py
          git add tests/diagnostics/sprint80c/test_80c2_aggregate_boundary.py
          git diff --cached --check
          git commit -m 'test(sprint80c): harden executable verification contracts'
          git push origin HEAD:sprint/80c2-aggregate-boundary
