name: Sprint 81.2 Canonical Authority Persistence

on:
  pull_request:
    branches:
      - baseline/local-import
    paths:
      - .github/workflows/sprint81-2-canonical-authority-persistence.yml
      - docs/implementation/sprint81/SPRINT81.2-canonical-authority-persistence.md
      - hfa-core/src/hfa/authority/__init__.py
      - hfa-core/src/hfa/authority/redis_persistence.py
      - hfa-core/src/hfa/lua/canonical_authority_commit.lua
      - hfa-core/tests/authority/test_redis_canonical_authority.py

permissions:
  contents: read

jobs:
  canonical-authority-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6392:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SPRINT81_2_REDIS_URL: redis://127.0.0.1:6392/0
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hfa-core with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'hfa-core[dev]'

      - name: Verify isolated Redis 7
        run: |
          python - <<'PY'
          import os
          import time
          import redis

          client = redis.Redis.from_url(os.environ["SPRINT81_2_REDIS_URL"], decode_responses=True)
          last_error = None
          for _ in range(30):
              try:
                  client.ping()
                  client.flushdb()
                  print(client.info("server")["redis_version"])
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"isolated Redis unavailable: {last_error}")
          PY

      - name: Verify exact Sprint 81.2 scope
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/sprint81-2-canonical-authority-persistence.yml",
              "docs/implementation/sprint81/SPRINT81.2-canonical-authority-persistence.md",
              "hfa-core/src/hfa/authority/__init__.py",
              "hfa-core/src/hfa/authority/redis_persistence.py",
              "hfa-core/src/hfa/lua/canonical_authority_commit.lua",
              "hfa-core/tests/authority/test_redis_canonical_authority.py",
          }
          observed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "34f7dd8e918829c55e6b64a5a09f623305dc9811...HEAD"],
                  text=True,
              ).splitlines()
          )
          assert observed == expected, {
              "missing": sorted(expected - observed),
              "unexpected": sorted(observed - expected),
          }
          print("SPRINT81_2_EXACT_SCOPE_OK")
          PY

      - name: Run Sprint 81.1 policy tests
        run: python -m pytest hfa-core/tests/authority/test_canonical_transition.py -q

      - name: Run Sprint 81.2 real Redis tests
        shell: bash
        run: |
          mkdir -p local_out/sprint81_2
          set -o pipefail
          python -m pytest hfa-core/tests/authority/test_redis_canonical_authority.py \
            -q --tb=short 2>&1 | tee local_out/sprint81_2/pytest.txt

      - name: Upload Sprint 81.2 test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint81-2-pytest-${{ github.event.pull_request.head.sha }}
          path: local_out/sprint81_2/pytest.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Compile authority package
        run: python -m compileall -q hfa-core/src/hfa/authority

      - name: Check patch whitespace
        run: git diff --check 34f7dd8e918829c55e6b64a5a09f623305dc9811...HEAD
