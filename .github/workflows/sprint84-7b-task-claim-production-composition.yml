name: Sprint 84.7B TASK_CLAIM Production Composition

on:
  pull_request:
    branches: [baseline/local-import]
    paths:
      - 'hfa-worker/src/hfa_worker/consumer.py'
      - 'hfa-worker/src/hfa_worker/main.py'
      - 'hfa-worker/src/hfa_worker/process_root.py'
      - 'tests/core/test_production_worker_composition_contract.py'
      - 'tests/core/test_production_worker_process_root_contract.py'
      - 'tests/integration/test_worker_task_claim_canonical_composition_integration.py'
      - '.github/workflows/sprint84-7b-task-claim-production-composition.yml'
      - '.github/workflows/sprint83-4-production-run-finalization-binding.yml'
      - 'docs/implementation/sprint84/SPRINT84.7B-task-claim-production-composition.md'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  REDIS_URL: redis://127.0.0.1:6389/0
  USE_EXISTING_REDIS: '1'
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_HEAD_BRANCH: ${{ github.head_ref }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7
        ports:
          - 6389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact Sprint 84.7B scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          python - <<'PY'
          import os
          import subprocess

          feature_branch = "sprint/84-7b-task-claim-production-composition"
          allowlist = {
              ".github/workflows/sprint84-7b-task-claim-production-composition.yml",
              ".github/workflows/sprint83-4-production-run-finalization-binding.yml",
              "docs/implementation/sprint84/SPRINT84.7B-task-claim-production-composition.md",
              "hfa-worker/src/hfa_worker/consumer.py",
              "hfa-worker/src/hfa_worker/main.py",
              "hfa-worker/src/hfa_worker/process_root.py",
              "tests/core/test_production_worker_composition_contract.py",
              "tests/core/test_production_worker_process_root_contract.py",
              "tests/integration/test_worker_task_claim_canonical_composition_integration.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{os.environ['PR_BASE_SHA']}...HEAD"],
                  text=True,
              ).splitlines()
          )
          if os.environ["PR_HEAD_BRANCH"] == feature_branch:
              assert changed == allowlist, {
                  "missing": sorted(allowlist - changed),
                  "unexpected": sorted(changed - allowlist),
              }
              mode = "FEATURE_EXACT_SCOPE"
          else:
              touched = changed & allowlist
              assert touched, {
                  "mode": "FUTURE_REGRESSION_TRIGGER",
                  "changed": sorted(changed),
              }
              mode = "REGRESSION_TRIGGER_INTERSECTION"
          forbidden = [
              path for path in changed
              if path.startswith("local_out/")
              or "__pycache__" in path
              or ".pytest_cache" in path
              or path.endswith(".pyc")
          ]
          assert not forbidden, sorted(forbidden)
          print("SPRINT84_7B_SCOPE_OK", mode, sorted(changed))
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e hfa-core -e hfa-control -e hfa-worker -e hfa-tools
          python -m pip install pytest pytest-asyncio redis fakeredis rfc8785 fastapi httpx uvicorn

      - name: Static production stream-routing guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main = Path("hfa-worker/src/hfa_worker/main.py").read_text(encoding="utf-8")
          consumer = Path("hfa-worker/src/hfa_worker/consumer.py").read_text(encoding="utf-8")
          acceptance = Path(
              "tests/integration/test_worker_task_claim_canonical_composition_integration.py"
          ).read_text(encoding="utf-8")

          assert "canonical_task_claim_binding_enabled=(" in main
          assert "or self._canonical_task_claim_binding_enabled" in consumer
          block = consumer[consumer.index("    async def _process_message("):]
          assert block.index("self._canonical_task_claim_binding_enabled") < block.index(
              "try_claim_and_mark_running"
          )
          assert "._process_message(" in acceptance
          assert 'event_type="TaskRequested"' in acceptance
          assert 'event_type="RunRequested"' in acceptance
          assert ".claim_start(" not in acceptance
          assert "IdempotencyGuard.try_claim_and_mark_running must be unreachable" in acceptance
          print("SPRINT84_7B_STREAM_ROUTING_GUARD_OK")
          PY

      - name: Focused composition and authority contracts
        shell: bash
        run: |
          set -o pipefail
          python -m pytest \
            tests/core/test_production_worker_composition_contract.py \
            tests/core/test_production_worker_process_root_contract.py \
            tests/core/test_task_claim_service_legacy_quarantine_contract.py \
            tests/core/test_task_requested_routing_contract.py \
            tests/unit/test_task_claim_authority_binding.py \
            tests/unit/test_task_claim_authority_contract.py \
            -q --tb=short | tee sprint84_7b_focused.txt
          ! grep -Eqi '[1-9][0-9]* (skipped|deselected|xfailed|xpassed)' sprint84_7b_focused.txt
          grep -Eq '(^|[^0-9])76 passed' sprint84_7b_focused.txt

      - name: Real Redis WorkerService canonical claim composition
        shell: bash
        run: |
          set -o pipefail
          python -m pytest \
            tests/integration/test_worker_task_claim_canonical_composition_integration.py \
            tests/integration/test_task_claim_authority_binding_integration.py \
            tests/integration/test_task_claim_authority_projection_integration.py \
            -q --tb=short | tee sprint84_7b_redis.txt
          ! grep -Eqi '[1-9][0-9]* (skipped|deselected|xfailed|xpassed)' sprint84_7b_redis.txt
          grep -Eq '(^|[^0-9])14 passed' sprint84_7b_redis.txt

      - name: Full TASK_CLAIM regression with new production composition
        shell: bash
        run: |
          set -o pipefail
          python -m pytest \
            tests/unit/test_task_claim_authority_binding.py \
            tests/unit/test_task_claim_authority_contract.py \
            tests/core/test_task_claim_legacy_direct_gate_contract.py \
            tests/core/test_task_claim_reservation_owner_lookup_contract.py \
            tests/core/test_task_claim_service_legacy_quarantine_contract.py \
            tests/core/test_task_claim_start_contract.py \
            tests/core/test_task_claim_status_taxonomy_contract.py \
            tests/integration/test_task_claim_authority_binding_integration.py \
            tests/integration/test_task_claim_authority_projection_integration.py \
            tests/integration/test_task_claim_legacy_direct_gate_integration.py \
            tests/integration/test_task_claim_reservation_integration.py \
            tests/integration/test_task_claim_start_integration.py \
            tests/integration/test_worker_task_claim_canonical_composition_integration.py \
            -q --tb=short | tee sprint84_7b_task_claim.txt
          ! grep -Eqi '[1-9][0-9]* (skipped|deselected|xfailed|xpassed)' sprint84_7b_task_claim.txt
          grep -Eq '(^|[^0-9])83 passed' sprint84_7b_task_claim.txt

      - name: Sprint 83.7 zero-deselection regression parity
        shell: bash
        run: |
          set -o pipefail
          python -m pytest \
            tests/unit/test_product_alpha_profile.py \
            tests/unit/test_product_alpha_worker_capabilities.py \
            tests/unit/test_product_alpha_readiness.py \
            tests/unit/test_product_alpha_run_shape.py \
            tests/unit/test_product_alpha_failure_contract.py \
            tests/core/test_production_run_finalization_binding.py \
            tests/core/test_production_scheduler_composition_contract.py \
            tests/unit/test_run_submission_coordinator.py \
            tests/unit/test_run_status_result_read_model.py \
            tests/unit/test_user_facing_run_result.py \
            tests/integration/test_run_status_result_read_model_integration.py \
            tests/integration/test_product_alpha_closure_e2e_83_7.py \
            -q --tb=short | tee sprint84_7b_83_7.txt
          ! grep -Eqi '[1-9][0-9]* (skipped|deselected|xfailed|xpassed)' sprint84_7b_83_7.txt
          grep -Eq '(^|[^0-9])174 passed' sprint84_7b_83_7.txt

      - name: Sprint 83.8 zero-deselection regression parity
        shell: bash
        run: |
          set -o pipefail
          python -m pytest \
            tests/unit/test_product_alpha_profile.py \
            tests/unit/test_product_alpha_worker_capabilities.py \
            tests/unit/test_product_alpha_readiness.py \
            tests/unit/test_product_alpha_run_shape.py \
            tests/unit/test_product_alpha_failure_contract.py \
            tests/unit/test_submission_idempotency.py \
            tests/core/test_production_run_finalization_binding.py \
            tests/core/test_production_scheduler_composition_contract.py \
            tests/unit/test_run_submission_coordinator.py \
            tests/unit/test_run_status_result_read_model.py \
            tests/unit/test_user_facing_run_result.py \
            tests/integration/test_run_status_result_read_model_integration.py \
            tests/integration/test_product_alpha_closure_e2e_83_7.py \
            tests/integration/test_product_alpha_idempotent_submission_e2e_83_8.py \
            -q --tb=short | tee sprint84_7b_83_8.txt
          ! grep -Eqi '[1-9][0-9]* (skipped|deselected|xfailed|xpassed)' sprint84_7b_83_8.txt
          grep -Eq '(^|[^0-9])199 passed' sprint84_7b_83_8.txt

      - name: Authority audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/authority_audit.py \
            --repo-root . \
            --format dashboard \
            --output sprint84_7b_authority.json \
            --fail-on banned
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("sprint84_7b_authority.json").read_text(encoding="utf-8"))
          counts = data.get("counts") or data.get("summary") or {}
          banned = counts.get("banned", data.get("banned", 0))
          assert int(banned or 0) == 0, (banned, data)
          print("SPRINT84_7B_AUTHORITY_BANNED_ZERO")
          PY

      - name: Compile and whitespace validation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            hfa-worker/src/hfa_worker/consumer.py \
            hfa-worker/src/hfa_worker/main.py \
            hfa-worker/src/hfa_worker/process_root.py \
            tests/core/test_production_worker_composition_contract.py \
            tests/core/test_production_worker_process_root_contract.py \
            tests/integration/test_worker_task_claim_canonical_composition_integration.py
          git diff --check "$PR_BASE_SHA...HEAD"
