name: Sprint 81.2 Contract Parity Fix

on:
  pull_request:
    branches:
      - baseline/local-import
    paths:
      - ".github/workflows/sprint81-2-contract-parity-fix.yml"
      - ".s81_2_contract_fix/**"

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6392:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRINT81_2_REDIS_URL: redis://127.0.0.1:6392/0
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical contract correction
        run: python .s81_2_contract_fix/patch.py

      - name: Install hfa-core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'hfa-core[dev]'

      - name: Verify isolated Redis 7
        run: |
          python - <<'PY'
          import os
          import redis
          client = redis.Redis.from_url(os.environ["SPRINT81_2_REDIS_URL"], decode_responses=True)
          assert client.ping()
          client.flushdb()
          print(client.info("server")["redis_version"])
          PY

      - name: Run Sprint 81.1 policy tests
        run: python -m pytest hfa-core/tests/authority/test_canonical_transition.py -q

      - name: Run expanded Sprint 81.2 Redis tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest hfa-core/tests/authority/test_redis_canonical_authority.py \
            -q --tb=short 2>&1 | tee /tmp/s81-2-contract-parity.txt

      - name: Compile authority package
        run: python -m compileall -q hfa-core/src/hfa/authority

      - name: Check target whitespace
        run: |
          git diff --check -- \
            docs/implementation/sprint81/SPRINT81.2-canonical-authority-persistence.md \
            hfa-core/src/hfa/authority/redis_persistence.py \
            hfa-core/src/hfa/lua/canonical_authority_commit.lua \
            hfa-core/tests/authority/test_redis_canonical_authority.py

      - name: Stage and verify patch scope
        run: |
          git add \
            docs/implementation/sprint81/SPRINT81.2-canonical-authority-persistence.md \
            hfa-core/src/hfa/authority/redis_persistence.py \
            hfa-core/src/hfa/lua/canonical_authority_commit.lua \
            hfa-core/tests/authority/test_redis_canonical_authority.py
          python - <<'PY'
          import subprocess
          expected = {
              "docs/implementation/sprint81/SPRINT81.2-canonical-authority-persistence.md",
              "hfa-core/src/hfa/authority/redis_persistence.py",
              "hfa-core/src/hfa/lua/canonical_authority_commit.lua",
              "hfa-core/tests/authority/test_redis_canonical_authority.py",
          }
          observed = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          assert observed == expected, {"expected": sorted(expected), "observed": sorted(observed)}
          print("SPRINT81_2_CONTRACT_PARITY_SCOPE_OK")
          PY

      - name: Commit verified contract correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sprint81.2): restore canonical store contract parity"
          git push origin HEAD:sprint/81-2-canonical-authority-persistence
