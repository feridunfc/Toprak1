name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Core + Worker tests ───────────────────────────────────────────────────
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e hfa-core
          pip install -e hfa-control
          pip install -e hfa-worker
          pip install pytest pytest-asyncio fakeredis anyio
          

      - name: Run core tests
        run: python -m pytest tests/core -q --tb=short

      - name: Run worker tests
        run: python -m pytest tests/ -q --tb=short --ignore=tests/integration --ignore=tests/legacy

  # ── Semantic runtime tests ────────────────────────────────────────────────
  test-semantic:
    name: Semantic Runtime (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e hfa-core
          pip install -e hfa-semantic
          pip install pytest pytest-asyncio fakeredis anyio

      - name: Run semantic tests
        run: python -m pytest hfa-semantic/tests/ -q --tb=short

  # ── Agent workflow tests ──────────────────────────────────────────────────
  test-agents:
    name: Agent Workflow (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e hfa-core
          pip install -e hfa-semantic
          pip install -e hfa-agents
          pip install pytest pytest-asyncio fakeredis anyio

      - name: Run agent tests
        run: python -m pytest hfa-agents/tests/ -q --tb=short

  # ── Cognitive smoke (fast gate — inline Python) ───────────────────────────
  test-cognitive:
    name: Cognitive Smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install all packages
        run: |
          python -m pip install --upgrade pip
          pip install -e hfa-core
          pip install -e hfa-control
          pip install -e hfa-worker
          pip install -e hfa-semantic
          pip install -e hfa-agents
          pip install pytest pytest-asyncio fakeredis anyio

      - name: Cognitive executor smoke
        env:
          EXECUTOR_MODE: cognitive
          REDIS_URL: ""
          COGNITIVE_BUDGET_CENTS: "2000"
        run: |
          python - <<'EOF'
          import asyncio

          async def _smoke():
              from hfa_worker.executor_factory import build_executor
              from hfa.events.schema import RunRequestedEvent

              executor = build_executor({"executor_mode": "cognitive", "redis_url": ""})
              assert type(executor).__name__ == "CognitiveExecutor"

              event = RunRequestedEvent(
                  run_id="ci-smoke-01",
                  tenant_id="ci-tenant",
                  agent_type="cognitive",
                  payload={"goal": "CI smoke test"},
              )
              result = await executor.execute(event)
              assert result.status in ("done", "failed")
              # Sprint 9.5: trace_id must be in payload
              assert "trace_id" in result.payload, "trace_id missing from payload"
              print("cognitive_smoke: PASS", flush=True)

          asyncio.run(_smoke())
          EOF

      - name: Semantic bridge degraded mode
        run: |
          python - <<'EOF'
          import asyncio

          async def _degraded():
              from hfa_agents.integration.semantic_bridge import SemanticBridge

              bridge = SemanticBridge(semantic_pipeline=None)
              result = await bridge.enrich_event(
                  {"event_id": "ci-degrade-01", "goal": "test"},
                  workflow_id="ci", execution_id="ci-01",
              )
              assert result is not None
              assert result.get("semantic_enriched") == False
              # Sprint 9.5: trace_id must be propagated
              assert "trace_id" in result, "trace_id missing from degraded enrichment"
              print("semantic_degraded: PASS", flush=True)

          asyncio.run(_degraded())
          EOF

      - name: Factory contract (never None, never tuple)
        run: |
          python - <<'EOF'
          from hfa_semantic.runtime.factory import build_pipeline_sync, SemanticPipeline

          p = build_pipeline_sync(redis_client=None)
          assert p is not None
          assert not isinstance(p, tuple)
          assert isinstance(p, SemanticPipeline)
          assert hasattr(p, "dedup_store")
          assert hasattr(p, "watermark")
          assert hasattr(p, "metrics")
          print("factory_contract: PASS", flush=True)
          EOF

      - name: WorkflowEngine max_steps guard
        run: |
          python - <<'EOF'
          import asyncio

          async def _limits():
              from hfa_agents.workflow.engine import WorkflowEngine, WorkflowStep

              engine = WorkflowEngine(semantic_engine=None, max_steps=2)
              result = await engine.run_workflow(
                  {"event_id": "ci-limits-01", "goal": "test"},
                  pipeline=[
                      WorkflowStep("supervisor", "s1"),
                      WorkflowStep("researcher", "s2"),
                      WorkflowStep("architect",  "s3"),
                  ],
              )
              assert result.status == "failed"
              assert "max_steps" in " ".join(result.reasoning_trace)
              print("max_steps_guard: PASS", flush=True)

          asyncio.run(_limits())
          EOF

  # ── Full cognitive pipeline + determinism — REAL GATE ─────────────────────
  #
  # Authoritative integration gate. Blocks merge on failure.
  # No || true. Runs both integration and determinism suites.
  full-cognitive-pipeline:
    name: Full Cognitive Pipeline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install all packages
        run: |
          python -m pip install --upgrade pip
          pip install -e hfa-core
          pip install -e hfa-control
          pip install -e hfa-worker
          pip install -e hfa-semantic
          pip install -e hfa-agents
          pip install pytest pytest-asyncio fakeredis anyio

      - name: Run full cognitive pipeline integration tests
        run: |
          python -m pytest tests/integration/test_full_cognitive_pipeline.py \
            -v --tb=short

      - name: Run determinism tests
        run: |
          python -m pytest tests/integration/test_determinism.py \
            -v --tb=short

  # ── Lint — all packages ───────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint all packages
        run: |
          ruff check \
            hfa-core/src \
            hfa-control/src \
            hfa-worker/src \
            hfa-semantic/src \
            hfa-agents/src
