name: Sprint 81.1 Receipt-First Final Correction

on:
  pull_request:
    branches:
      - baseline/local-import
    paths:
      - .github/workflows/sprint81-canonical-transition-core.yml
      - .tmp/81receipt/**

permissions:
  contents: write

jobs:
  apply-correction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: sprint/81-1-canonical-transition-core
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct verified correction package
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/81receipt/chunk_* | tr -d '\n' | base64 -d > /tmp/receipt-first-final.tar.gz
          echo '6ebe43403a6d2e7959a0688d05ac4978fa663dd6b9cf3d8056743bd44ff31501  /tmp/receipt-first-final.tar.gz' | sha256sum -c -
          tar -xzf /tmp/receipt-first-final.tar.gz -C .
          cat > /tmp/receipt-first.sha256 <<'EOF'
          b7945a61d231e79981bfa46edfb02109b45f686b786ccc3d0ba8987c04292ab8  docs/implementation/sprint81/SPRINT81.1-canonical-transition-core.md
          26c63292ce58237bd112afb824f66dc8cef7d035a55eae3c44d14cee2806f0f8  hfa-core/src/hfa/authority/canonical_transition.py
          a1f41a31cadc70cf81fa342cd9c29467b2a05f48c1859dbab014793116ee190f  hfa-core/tests/authority/test_canonical_transition.py
          EOF
          sed -i 's/^          //' /tmp/receipt-first.sha256
          sha256sum -c /tmp/receipt-first.sha256
      - name: Install hfa-core with test dependencies
        run: python -m pip install -e 'hfa-core[dev]'
      - name: Run 77 authority-core tests
        run: python -m pytest hfa-core/tests/authority/test_canonical_transition.py -q
      - name: Compile authority package
        run: python -m compileall -q hfa-core/src/hfa/authority
      - name: Check target-file whitespace
        run: >-
          git diff --check --
          docs/implementation/sprint81/SPRINT81.1-canonical-transition-core.md
          hfa-core/src/hfa/authority/canonical_transition.py
          hfa-core/tests/authority/test_canonical_transition.py
      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/81receipt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/implementation/sprint81/SPRINT81.1-canonical-transition-core.md
          git add hfa-core/src/hfa/authority/canonical_transition.py
          git add hfa-core/tests/authority/test_canonical_transition.py
          git add -A .tmp/81receipt
          git diff --cached --check
          git commit -m 'fix(sprint81): resolve receipts before operation classification'
          git push origin HEAD:sprint/81-1-canonical-transition-core
