name: Sprint 81.2 Final Status Binding

on:
  pull_request:
    branches:
      - baseline/local-import
    paths:
      - ".github/workflows/s81-2-finalize-status.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind final status and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/implementation/sprint81/SPRINT81.2-canonical-authority-persistence.md")
          text = path.read_text(encoding="utf-8")
          old = "status: CORRECTED_READY_FOR_INDEPENDENT_IMPLEMENTATION_RE_REVIEW"
          new = "status: FINAL_CORRECTION_READY_FOR_INDEPENDENT_IMPLEMENTATION_RE_REVIEW"
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git rm .github/workflows/s81-2-finalize-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation/sprint81/SPRINT81.2-canonical-authority-persistence.md
          git commit -m "docs(sprint81.2): bind final correction status"
          git push origin HEAD:sprint/81-2-canonical-authority-persistence
