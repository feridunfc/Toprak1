          VALIDATOR = ROOT / "scripts/sprint80c/validate_aggregate_boundary.py"
          TESTS = ROOT / "tests/diagnostics/sprint80c/test_80c2_aggregate_boundary.py"

          def read_json(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))

          def write_json(path: Path, value):
              path.write_text(json.dumps(value, indent=2, sort_keys=False) + "\n", encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one occurrence, found {count}")
              return text.replace(old, new, 1)

          matrix = read_json(MATRIX)
          matrix["decision_status"] = DECISION_STATUS
          predecessor = matrix["predecessor_governance"]
          predecessor.update({
              "acceptance_comment_id": COMMENT_ID,
              "acceptance_type": "POST_MERGE_HUMAN_ARCHITECTURE_ACCEPTANCE",
              "accepted_head": ACCEPTED_HEAD,
              "human_architecture_acceptance": "ACCEPT",
              "status": "VERIFIED",
          })
          matrix["dependencies"][0] = "ADR-080C1 post-merge human architecture acceptance VERIFIED by comment 5083135387"
          matrix["verification_contracts"]["predecessor_human_acceptance_verified"] = True
          matrix["verification_contracts"]["predecessor_acceptance_record_present"] = True
          for binding in matrix["source_bindings"]:
              if binding["path"] == "docs/adr/sprint80/ADR-080C1-runtime-truth-authority.md":
                  binding["purpose"] = "merged predecessor with verified post-merge human acceptance comment 5083135387"
          write_json(MATRIX, matrix)

          adr = ADR.read_text(encoding="utf-8")
          adr = replace_once(
              adr,
              "- Status: **CORRECTED TECHNICAL RECOMMENDATION — PREDECESSOR ACCEPTANCE PENDING**",
              "- Status: **CORRECTED TECHNICAL RECOMMENDATION — PREDECESSOR ACCEPTED; FINAL RE-REVIEW REQUIRED**",
              "ADR status",
          )
          adr = replace_once(
              adr,
              "ADR-080C.1 is merged at `9d7c7a6ad52a8a546a708dda048f28d4e23befc6`, but no exact post-merge human architecture acceptance record is bound to this package.",
              "ADR-080C.1 is merged at `9d7c7a6ad52a8a546a708dda048f28d4e23befc6` and its exact post-merge human architecture acceptance is bound by PR #98 comment `5083135387`.",
              "ADR predecessor paragraph",
          )
          adr = replace_once(
              adr,
              "accepted_head_candidate: 9ad9503badd72afb0a935dbb8c02e828ea02d3e2\nmerge_commit: 9d7c7a6ad52a8a546a708dda048f28d4e23befc6\nacceptance_type: POST_MERGE_HUMAN_ARCHITECTURE_ACCEPTANCE_REQUIRED\nacceptance_comment_id: null\nhuman_architecture_acceptance: PENDING\nstatus: BLOCKING_GOVERNANCE_PREREQUISITE",
              "accepted_head_candidate: 9ad9503badd72afb0a935dbb8c02e828ea02d3e2\naccepted_head: 9ad9503badd72afb0a935dbb8c02e828ea02d3e2\nmerge_commit: 9d7c7a6ad52a8a546a708dda048f28d4e23befc6\nacceptance_type: POST_MERGE_HUMAN_ARCHITECTURE_ACCEPTANCE\nacceptance_comment_id: 5083135387\nhuman_architecture_acceptance: ACCEPT\nstatus: VERIFIED",
              "ADR predecessor YAML",
          )
          adr = replace_once(
              adr,
              "`MERGED` is not treated as `HUMAN_ACCEPTED`. This package may become technically complete while remaining governance-blocked.",
              "`MERGED` was not treated as `HUMAN_ACCEPTED`; the separate exact post-merge acceptance record is now verified. Sprint 80C.2 itself still requires final independent re-review and a separate human acceptance before merge.",
              "ADR governance explanation",
          )
          adr = replace_once(
              adr,
              "- ADR-080C.1 post-merge human architecture acceptance record;",
              "- ADR-080C.1 post-merge human architecture acceptance record — SATISFIED by comment `5083135387`;",
              "ADR dependency",
          )
          adr = replace_once(
              adr,
              "  predecessor_human_acceptance_verified: false\n  predecessor_acceptance_record_present: false",
              "  predecessor_human_acceptance_verified: true\n  predecessor_acceptance_record_present: true\n  predecessor_acceptance_comment_id: 5083135387",
              "ADR governance state",
          )
          ADR.write_text(adr, encoding="utf-8")

          validator = VALIDATOR.read_text(encoding="utf-8")
          validator = replace_once(
              validator,
              'matrix.get("decision_status") == "CORRECTED_TECHNICAL_RECOMMENDATION_PREDECESSOR_ACCEPTANCE_PENDING"',
              f'matrix.get("decision_status") == "{DECISION_STATUS}"',
              "validator decision status",
          )
          validator = replace_once(
              validator,
              '''    add_error(
        predecessor.get("acceptance_comment_id") is None
        and predecessor.get("human_architecture_acceptance") == "PENDING",
        "predecessor must remain pending without record",
        errors,
    )''',
              '''    add_error(
        predecessor.get("accepted_head") == "9ad9503badd72afb0a935dbb8c02e828ea02d3e2"
        and predecessor.get("acceptance_comment_id") == 5083135387
        and predecessor.get("acceptance_type") == "POST_MERGE_HUMAN_ARCHITECTURE_ACCEPTANCE"
        and predecessor.get("human_architecture_acceptance") == "ACCEPT"
        and predecessor.get("status") == "VERIFIED",
        "predecessor acceptance record",
        errors,
    )''',
              "validator predecessor acceptance",
          )
          validator = replace_once(
              validator,
              '''    add_error(set((resolution.get("value") or {}).keys()) == required_resolution_fields, "logical-edge resolution value", errors)''',
              '''    resolution_value = resolution.get("value") or {}
    add_error(
        set(resolution_value) == required_resolution_fields
        and all(resolution_value.get(key) == "REQUIRED" for key in required_resolution_fields),
        "logical-edge resolution value",
        errors,
    )''',
              "validator resolution values",
          )
          validator = replace_once(
              validator,
              '''    add_error(terminal.get("done", {}).get("unsatisfied_edge_command") == "CONTRADICTION", "done disposition", errors)
    add_error(terminal.get("failed", {}).get("unsatisfied_edge_command") == "CONTRADICTION", "failed disposition", errors)''',
              '''    for state in ("done", "failed"):
        disposition = terminal.get(state, {})
        add_error(
            disposition.get("unsatisfied_edge_command") == "CONTRADICTION"
            and disposition.get("child_mutation") == 0
            and disposition.get("durable_conflict_record") == "REQUIRED"
            and disposition.get("reconciliation_candidate") == "REQUIRED"
            and disposition.get("retry") == "STOP",
            f"{state} disposition",
            errors,
        )''',
              "validator done failed exact",
          )
          validator = replace_once(
              validator,
              '''            and set(disposition.get("required_authority_evidence", []))
            == {"terminal_transition_id", "child_state_authority_revision"}
            and disposition.get("retry") == "STOP",''',
              '''            and set(disposition.get("required_authority_evidence", []))
            == {"terminal_transition_id", "child_state_authority_revision"}
            and disposition.get("missing_authority_evidence")
            == "MISSING_AUTHORITY_DURABLE_CONFLICT_AND_RECONCILIATION"
            and disposition.get("retry") == "STOP",''',
              "validator terminal missing authority",
          )
          validator = replace_once(
              validator,
              '''        contracts.get("predecessor_human_acceptance_verified") is False
        and contracts.get("predecessor_acceptance_record_present") is False,''',
              '''        contracts.get("predecessor_human_acceptance_verified") is True
        and contracts.get("predecessor_acceptance_record_present") is True,''',
              "validator governance flags",
          )

          manifest_function = '''def validate_manifest(root: Path, manifest: dict[str, Any]) -> list[str]:
    errors: list[str] = []
    add_error(manifest.get("schema_version") == 3 and manifest.get("decision_id") == "ADR-080C2", "manifest identity", errors)
    add_error(
        manifest.get("base_head") == BASE
        and manifest.get("frozen_source_head") == SOURCE
        and manifest.get("frozen_artifact_sha256") == ZIP_SHA
        and manifest.get("aggregate_evidence_sha256") == EVIDENCE_SHA
        and manifest.get("bundle_index_algorithm") == "sorted_utf8_lines:path\\0size_bytes\\0sha256\\n"
        and manifest.get("product_source_mutation") == 0
        and manifest.get("implementation_authorized") is False,
        "manifest immutable register",
        errors,
    )
    add_error(
        manifest.get("predecessor_acceptance_record_present") is True
        and manifest.get("predecessor_acceptance_verified") is True
        and manifest.get("predecessor_human_acceptance") == "ACCEPT"
        and manifest.get("predecessor_acceptance_comment_id") == 5083135387
        and manifest.get("predecessor_accepted_head") == "9ad9503badd72afb0a935dbb8c02e828ea02d3e2"
        and manifest.get("predecessor_merge_commit") == BASE,
        "manifest predecessor acceptance",
        errors,
    )
    entries = manifest.get("artifacts", [])
    expected = PATHS - {"docs/adr/sprint80/aggregate_boundary_manifest.json"}
    add_error({row.get("path") for row in entries} == expected and len(entries) == 6, "manifest paths", errors)
    for row in entries:
        path = root / row["path"]
        add_error(path.exists(), f'missing {row["path"]}', errors)
        if path.exists():
            add_error(path.stat().st_size == row["size_bytes"], f'size {row["path"]}', errors)
            add_error(sha(path.read_bytes()) == row["sha256"], f'hash {row["path"]}', errors)
    add_error(manifest.get("bundle_index_sha256") == sha(bundle_index(entries)), "bundle index", errors)
    return errors

'''
          start = validator.index("def validate_manifest(")
          end = validator.index("def validate_scope(", start)
          validator = validator[:start] + manifest_function + validator[end:]
          VALIDATOR.write_text(validator, encoding="utf-8")

          tests = TESTS.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              '''def test_predecessor_is_not_falsely_accepted():
    value = matrix()["predecessor_governance"]
    assert value["accepted_head_candidate"] == "9ad9503badd72afb0a935dbb8c02e828ea02d3e2"
    assert value["acceptance_comment_id"] is None
    assert value["human_architecture_acceptance"] == "PENDING"''',
              '''def test_predecessor_acceptance_is_exactly_bound():
    value = matrix()["predecessor_governance"]
    assert value["accepted_head_candidate"] == "9ad9503badd72afb0a935dbb8c02e828ea02d3e2"
    assert value["accepted_head"] == "9ad9503badd72afb0a935dbb8c02e828ea02d3e2"
    assert value["acceptance_comment_id"] == 5083135387
    assert value["acceptance_type"] == "POST_MERGE_HUMAN_ARCHITECTURE_ACCEPTANCE"
    assert value["human_architecture_acceptance"] == "ACCEPT"
    assert value["status"] == "VERIFIED"''',
              "tests predecessor acceptance",
          )
          tests = replace_once(
              tests,
              '''    assert set(value) == {
        "accepted_edge_command_id",
        "accepted_parent_transition_id",
        "accepted_outcome",
        "graph_identity",
        "graph_revision_or_topology_hash",
        "applied_child_revision",
    }''',
              '''    assert set(value) == {
        "accepted_edge_command_id",
        "accepted_parent_transition_id",
        "accepted_outcome",
        "graph_identity",
        "graph_revision_or_topology_hash",
        "applied_child_revision",
    }
    assert all(field_value == "REQUIRED" for field_value in value.values())''',
              "tests resolution values",
          )
          tests = replace_once(
              tests,
              '''def test_done_and_failed_late_edges_are_contradictions():
    value = matrix()["terminal_state_command_disposition"]
    assert value["done"]["unsatisfied_edge_command"] == "CONTRADICTION"
    assert value["failed"]["unsatisfied_edge_command"] == "CONTRADICTION"''',
              '''def test_done_and_failed_late_edges_are_exact_contradictions():
    value = matrix()["terminal_state_command_disposition"]
    for state in ("done", "failed"):
        assert value[state] == {
            "unsatisfied_edge_command": "CONTRADICTION",
            "child_mutation": 0,
            "durable_conflict_record": "REQUIRED",
            "reconciliation_candidate": "REQUIRED",
            "retry": "STOP",
        }''',
              "tests done failed exact",
          )
          tests = replace_once(
              tests,
              '''    assert set(value["required_authority_evidence"]) == {"terminal_transition_id", "child_state_authority_revision"}
    assert value["retry"] == "STOP"''',
              '''    assert set(value["required_authority_evidence"]) == {"terminal_transition_id", "child_state_authority_revision"}
    assert value["missing_authority_evidence"] == "MISSING_AUTHORITY_DURABLE_CONFLICT_AND_RECONCILIATION"
    assert value["retry"] == "STOP"''',
              "tests dead letter missing authority",
          )
          tests = replace_once(
              tests,
              '''    assert set(value["required_authority_evidence"]) == {"terminal_transition_id", "child_state_authority_revision"}
    assert value["retry"] == "STOP"''',
              '''    assert set(value["required_authority_evidence"]) == {"terminal_transition_id", "child_state_authority_revision"}
    assert value["missing_authority_evidence"] == "MISSING_AUTHORITY_DURABLE_CONFLICT_AND_RECONCILIATION"
    assert value["retry"] == "STOP"''',
              "tests skipped missing authority",
          )
          tests = replace_once(
              tests,
              '''    assert report["technical_status"] == "PASS"
    assert report["status"] == "PASS_WITH_GOVERNANCE_BLOCKER"
    assert report["governance_status"] == "BLOCKED"
    assert report["implementation_authorized"] is False''',
              '''    assert report["technical_status"] == "PASS"
    assert report["status"] == "PASS"
    assert report["governance_status"] == "PASS"
    assert report["predecessor_human_acceptance"] == "ACCEPT"
    assert report["implementation_authorized"] is False''',
              "tests full bundle governance",
          )
          negative_tests = '''def test_negative_optional_logical_edge_resolution_field():
    value = copy.deepcopy(matrix())
    value["logical_edge_resolution_authority"]["value"]["accepted_outcome"] = "OPTIONAL"
    assert "logical-edge resolution value" in validator.validate_matrix(value, evidence())


def test_negative_done_retry_continues():
    value = copy.deepcopy(matrix())
    value["terminal_state_command_disposition"]["done"]["retry"] = "CONTINUE"
    assert "done disposition" in validator.validate_matrix(value, evidence())


def test_negative_failed_conflict_record_removed():
    value = copy.deepcopy(matrix())
    value["terminal_state_command_disposition"]["failed"]["durable_conflict_record"] = "NONE"
    assert "failed disposition" in validator.validate_matrix(value, evidence())


def test_negative_missing_terminal_evidence_silent_noop_dead_lettered():
    value = copy.deepcopy(matrix())
    value["terminal_state_command_disposition"]["dead_lettered"]["missing_authority_evidence"] = "SILENT_NOOP"
    assert "dead_lettered disposition" in validator.validate_matrix(value, evidence())


def test_negative_missing_terminal_evidence_silent_noop_skipped():
    value = copy.deepcopy(matrix())
    value["terminal_state_command_disposition"]["skipped"]["missing_authority_evidence"] = "SILENT_NOOP"
    assert "skipped disposition" in validator.validate_matrix(value, evidence())


def test_negative_manifest_immutable_base_head():
    value = copy.deepcopy(validator.readj(MANIFEST))
    value["base_head"] = "wrong"
    assert "manifest immutable register" in validator.validate_manifest(ROOT, value)


def test_negative_manifest_predecessor_comment_id():
    value = copy.deepcopy(validator.readj(MANIFEST))
    value["predecessor_acceptance_comment_id"] = 0
    assert "manifest predecessor acceptance" in validator.validate_manifest(ROOT, value)


'''
          tests = replace_once(
              tests,
              "def test_negative_product_source_scope():\n",
              negative_tests + "def test_negative_product_source_scope():\n",
              "tests negative hardening insertion",
          )
          TESTS.write_text(tests, encoding="utf-8")

          manifest = read_json(MANIFEST)
          manifest.update({
              "predecessor_acceptance_record_present": True,
              "predecessor_acceptance_verified": True,
              "predecessor_human_acceptance": "ACCEPT",
              "predecessor_acceptance_comment_id": COMMENT_ID,
              "predecessor_accepted_head": ACCEPTED_HEAD,
              "predecessor_merge_commit": BASE,
          })
          for row in manifest["artifacts"]:
              path = ROOT / row["path"]
              data = path.read_bytes()
              row["size_bytes"] = len(data)
              row["sha256"] = hashlib.sha256(data).hexdigest()
          bundle = "".join(
              f'{row["path"]}\0{row["size_bytes"]}\0{row["sha256"]}\n'
              for row in sorted(manifest["artifacts"], key=lambda item: item["path"])
          ).encode("utf-8")
          manifest["bundle_index_sha256"] = hashlib.sha256(bundle).hexdigest()
          write_json(MANIFEST, manifest)
          PY
      - name: Validate hardened package
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/diagnostics/sprint80c/test_80c2_aggregate_boundary.py -q
          python scripts/sprint80c/validate_aggregate_boundary.py --repo-root .
          git diff --check
      - name: Commit one correction tranche
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-harden-80c2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/adr/sprint80/ADR-080C2-aggregate-boundary.md
          git add docs/adr/sprint80/aggregate_boundary_matrix.json
          git add docs/adr/sprint80/aggregate_boundary_manifest.json
          git add scripts/sprint80c/validate_aggregate_boundary.py
          git add tests/diagnostics/sprint80c/test_80c2_aggregate_boundary.py
          git add -A .github/workflows/temp-harden-80c2.yml
          git diff --cached --check
          git commit -m 'test(sprint80c): harden executable verification contracts'
          git push origin HEAD:sprint/80c2-aggregate-boundary
