name: Temporary 80C.2 Verification Hardening

on:
  push:
    branches:
      - sprint/80c2-aggregate-boundary
    paths:
      - .github/workflows/temp-harden-80c2.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: sprint/80c2-aggregate-boundary
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Apply exact hardening correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          ROOT = Path.cwd()
          COMMENT_ID = 5083135387
          ACCEPTED_HEAD = "9ad9503badd72afb0a935dbb8c02e828ea02d3e2"
          BASE = "9d7c7a6ad52a8a546a708dda048f28d4e23befc6"
          SOURCE = "5734ac60704f8546b8ce67e766e042ff2ce4c412"
          ZIP_SHA = "7b4e85209658619d400faebe3ee637580cbbebbb231c43531360ef3a79241588"
          EVIDENCE_SHA = "ac5ab01455a3e8acb6bc0043167849e398df393819f5b4cdf14e9770dea9f478"
          DECISION_STATUS = "CORRECTED_TECHNICAL_RECOMMENDATION_PREDECESSOR_ACCEPTED_EXECUTABLE_VERIFICATION_HARDENED"

