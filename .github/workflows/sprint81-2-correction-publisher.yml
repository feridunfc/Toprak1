name: Sprint 81.2 Correction Publisher

on:
  pull_request:
    branches:
      - baseline/local-import
    paths:
      - ".github/workflows/sprint81-2-correction-publisher.yml"
      - ".s81_2_patch/**"

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6392:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRINT81_2_REDIS_URL: redis://127.0.0.1:6392/0
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hfa-core test dependencies
        run: python -m pip install -e 'hfa-core[dev]'

      - name: Reconstruct corrected package
        shell: bash
        run: |
          set -euo pipefail
          cat .s81_2_patch/redis.part.* | base64 -d > hfa-core/src/hfa/authority/redis_persistence.py
          cat .s81_2_patch/lua.part.* | base64 -d > hfa-core/src/hfa/lua/canonical_authority_commit.lua
          cat .s81_2_patch/tests.part.* | base64 -d > hfa-core/tests/authority/test_redis_canonical_authority.py
          base64 -d .s81_2_patch/doc.b64 > docs/implementation/sprint81/SPRINT81.2-canonical-authority-persistence.md

      - name: Verify exact correction hashes
        run: |
          cat > /tmp/s81-2.sha256 <<'CHECKSUMS'
          ec997b6b0c1fbb8dfe8e158cd491f3d1a20d2295d136af99f5a667385e6b8fe7  hfa-core/src/hfa/authority/redis_persistence.py
          d1449941f7da70f8d8e97721f0a077fcb06c606d8a36e2ae54baa8d6a0d0f244  hfa-core/src/hfa/lua/canonical_authority_commit.lua
          88314c7c240e113bb16db223d41ea5e24c6886591e2abb4e0c157cbac7c356c7  hfa-core/tests/authority/test_redis_canonical_authority.py
          d82e6f8bcba2531610ca0dde140f8cd4893df530adf8112a917f36b3fcca3acc  docs/implementation/sprint81/SPRINT81.2-canonical-authority-persistence.md
          CHECKSUMS
          sha256sum -c /tmp/s81-2.sha256

      - name: Verify isolated Redis 7
        run: |
          python - <<'PY'
          import os
          import redis
          client = redis.Redis.from_url(os.environ["SPRINT81_2_REDIS_URL"], decode_responses=True)
          assert client.ping()
          client.flushdb()
          PY

      - name: Run Sprint 81.1 policy tests
        run: python -m pytest hfa-core/tests/authority/test_canonical_transition.py -q

      - name: Run expanded Sprint 81.2 real Redis tests
        run: python -m pytest hfa-core/tests/authority/test_redis_canonical_authority.py -q --tb=short

      - name: Compile authority package
        run: python -m compileall -q hfa-core/src/hfa/authority

      - name: Check corrected target whitespace
        run: |
          git diff --check -- \
            docs/implementation/sprint81/SPRINT81.2-canonical-authority-persistence.md \
            hfa-core/src/hfa/authority/redis_persistence.py \
            hfa-core/src/hfa/lua/canonical_authority_commit.lua \
            hfa-core/tests/authority/test_redis_canonical_authority.py

      - name: Publish verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/implementation/sprint81/SPRINT81.2-canonical-authority-persistence.md \
            hfa-core/src/hfa/authority/redis_persistence.py \
            hfa-core/src/hfa/lua/canonical_authority_commit.lua \
            hfa-core/tests/authority/test_redis_canonical_authority.py
          git rm -r .s81_2_patch
          git commit -m "fix(sprint81.2): close durable authority integrity review"
          git push origin HEAD:sprint/81-2-canonical-authority-persistence
