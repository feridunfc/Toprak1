# .github/workflows/ci.yml — IRONCLAD OS (extends existing CI)
# Adds: cognitive integration tests + full OS smoke test

name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Existing IRONCLAD core tests (unchanged) ───────────────────────────────
  test-core:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e hfa-core -e hfa-control -e hfa-worker
          pip install pytest pytest-asyncio fakeredis anyio
      - name: Core tests
        run: python -m pytest tests/core -q --tb=short
      - name: Worker tests
        run: python -m pytest tests/ -q --tb=short --ignore=tests/integration --ignore=tests/legacy

  # ── Semantic layer tests ────────────────────────────────────────────────────
  test-semantic:
    name: Semantic Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install -e hfa-core -e hfa-semantic[redis,test]
          pip install pytest pytest-asyncio
      - name: Semantic unit tests
        run: python -m pytest hfa-semantic/tests/unit -q --tb=short

  # ── Agent layer tests ───────────────────────────────────────────────────────
  test-agents:
    name: Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install -e hfa-core -e hfa-semantic -e hfa-agents[test]
          pip install pytest pytest-asyncio pytest-mock
      - name: Agent tests
        run: python -m pytest hfa-agents/tests -q --tb=short

  # ── Full OS integration tests (new) ────────────────────────────────────────
  test-os-integration:
    name: OS Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install full stack
        run: |
          pip install -e hfa-core -e hfa-control -e hfa-worker
          pip install -e hfa-semantic[redis] -e hfa-agents[test]
          pip install pytest pytest-asyncio pytest-mock anyio
      - name: Copy integration files
        run: |
          cp ironclad-os/integration/cognitive_executor.py hfa-worker/src/hfa_worker/
          cp ironclad-os/integration/feedback_writer.py hfa-worker/src/hfa_worker/
          cp ironclad-os/integration/executor_factory_patch.py \
             hfa-worker/src/hfa_worker/executor_factory.py
      - name: OS integration tests
        run: |
          python -m pytest ironclad-os/integration/test_full_integration.py \
            -q --tb=short -v
        env:
          USE_FAKE_REDIS: "1"

  # ── Redis chaos integration (requires real Redis) ───────────────────────────
  test-redis-chaos:
    name: Redis Chaos Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install -e hfa-core -e hfa-control -e hfa-worker
          pip install -e hfa-semantic[redis]
          pip install pytest pytest-asyncio anyio
      - name: Chaos tests
        run: python -m pytest tests/integration -q --tb=short -k "chaos or redis"
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          USE_FAKE_REDIS: "0"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: |
          ruff check hfa-core/src hfa-control/src hfa-worker/src
          ruff check hfa-semantic/src hfa-agents/src || true   # warn only (new packages)
