global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ironclad-control"
    static_configs:
      - targets: ["control-plane:8000"]
    metrics_path: /metrics

  - job_name: "ironclad-worker"
    static_configs:
      - targets: ["worker:9091"]    # semantic metrics port
    metrics_path: /metrics

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
